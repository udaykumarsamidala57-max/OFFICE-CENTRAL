# Company DB connections are created by DBUtil1 from DB_HOST, DB_PORT,
# DB_USER and DB_PASSWORD environment variables. Login is checked against SRS.
app.auth.table=${AUTH_TABLE:users}

# ===============================
# Thymeleaf
# ===============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# ===============================
# Server
# ===============================

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Set SESSION_COOKIE_SECURE=true when the cloud platform serves the app over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}


