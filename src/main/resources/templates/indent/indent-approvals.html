<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Approve Indent</title>
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link rel="stylesheet" th:href="@{/css/indent-approvals.css}">
</head>
<body class="app-body" th:attr="data-approval-base=@{/AIndentListServlet}">
<div th:replace="~{fragments/app-header :: appHeader('approve')}"></div>
<main class="app-main-content approval-content">
    <section class="approval-page">
        <div class="page-heading">
            <h1>Approve Indent</h1>
            <span class="group-count"><strong th:text="${#lists.size(approvalGroups)}">0</strong> open</span>
        </div>
        <div id="approvalMessage" class="approval-message" role="alert" hidden></div>

        <div class="approval-card">
            <section class="indent-card" th:each="group : ${approvalGroups}" th:attr="data-indent-no=${group.indentNo}">
                <header class="indent-header">
                    <div class="indent-no">
                        <span th:text="|#${group.indentNo}|">#1001</span>
                        <span class="badge" th:classappend="${#strings.equalsIgnoreCase(group.type, 'Purchase')} ? ' badge-purchase' : (${#strings.equalsIgnoreCase(group.type, 'Issue')} ? ' badge-issue' : '')" th:text="${group.type}">Purchase</span>
                    </div>
                    <div th:text="${group.date}">2026-10-05</div>
                    <div th:text="${group.department}">Store</div>
                    <div th:text="${group.requestedBy}">User</div>
                    <div class="status-text" th:text="${#strings.isEmpty(group.status) ? 'Pending' : group.status}">Pending</div>
                </header>
                <div class="table-scroll">
                    <table class="inner-table">
                        <thead><tr><th>ID</th><th>Item</th><th>Avl</th><th>Req</th><th>UOM</th><th>Purpose</th><th>I/C</th><th>L1 Approved By</th><th>L2</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr class="approval-item" th:each="item : ${group.items}" th:attr="data-item-id=${item.id}">
                            <td th:text="${item.id}">1</td>
                            <td class="item-name" th:text="${item.itemName}">Item name</td>
                            <td class="number-cell" th:text="${item.balanceQty}">0</td>
                            <td class="number-cell requested-qty" th:text="${item.qty}">1</td>
                            <td class="uom-cell" th:text="${item.uom}">Nos</td>
                            <td class="purpose-cell" th:text="${item.purpose}">Purpose</td>
                            <td class="ic-status">
                                <button type="button" class="btn-green approve-l1" th:if="${(isSuperAdmin or allowedButtonCodes.contains('APPROVE_L1')) and !#strings.equalsIgnoreCase(item.levelOneStatus, 'Approved')}" th:attr="data-id=${item.id}">Approve</button>
                                <span class="approved-badge" th:if="${#strings.equalsIgnoreCase(item.levelOneStatus, 'Approved')}">✔ Approved</span>
                                <small class="approval-date" th:if="${item.levelOneApprovedDate != null}" th:text="${#dates.format(item.levelOneApprovedDate, 'dd MMM yyyy')}">05 Oct 2026</small>
                            </td>
                            <td class="approved-by" th:attr="data-id=${item.id}">
                                <span th:text="${#strings.isEmpty(item.levelOneApprovedBy) ? '-' : item.levelOneApprovedBy}">-</span>
                                <small class="approval-date" th:if="${item.levelOneApprovedDate != null}" th:text="${#dates.format(item.levelOneApprovedDate, 'dd MMM yyyy')}">05 Oct 2026</small>
                            </td>
                            <td class="l2-status-cell">
                                <span class="l2-status" th:classappend="${#strings.equalsIgnoreCase(item.levelTwoStatus, 'Approved')} ? ' approved' : ''" th:text="${#strings.isEmpty(item.levelTwoStatus) ? (#strings.equalsIgnoreCase(item.indentStatus, 'Management Note') ? 'Management Note' : 'Pending') : item.levelTwoStatus}">Pending</span>
                                <small class="approved-by-name" th:text="${#strings.isEmpty(item.levelTwoApprovedBy) ? '' : 'By: ' + item.levelTwoApprovedBy}"></small>
                                <small class="approval-date" th:if="${item.levelTwoApprovedDate != null}" th:text="${#dates.format(item.levelTwoApprovedDate, 'dd MMM yyyy')}">05 Oct 2026</small>
                            </td>
                            <td class="action-cell">
                                <div class="final-action" th:if="${(isSuperAdmin or (canFinalApprove and allowedButtonCodes.contains('CONFIRM_L2'))) and #strings.equalsIgnoreCase(item.levelOneStatus, 'Approved') and !#strings.equalsIgnoreCase(item.levelTwoStatus, 'Approved') and !#strings.equalsIgnoreCase(item.indentStatus, 'Management Note')}">
                                    <select class="next-step" th:attr="data-id=${item.id}" aria-label="Choose next action">
                                        <option value="">Select</option>
                                        <option th:if="${#strings.equalsIgnoreCase(group.type, 'Issue')}" value="Issue">Issue</option>
                                        <option th:if="${#strings.equalsIgnoreCase(group.type, 'Purchase')}" value="PO">PO</option>
                                        <option value="Cancelled">Cancel</option>
                                        <option value="Management Note">Management Note</option>
                                    </select>
                                    <button type="button" class="btn-blue confirm-final" th:attr="data-id=${item.id}">Confirm</button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
        <div class="empty-approvals" th:if="${#lists.isEmpty(approvalGroups)}">No open indents require approval.</div>
    </section>
</main>
<script th:src="@{/js/indent-approvals.js}"></script>
</body>
</html>
