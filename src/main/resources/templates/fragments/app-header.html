<div xmlns:th="http://www.thymeleaf.org" th:fragment="appHeader(activePage)" th:remove="tag">
    <div class="app-overlay" id="appOverlay"></div>

    <!-- Main Navigation Sidebar -->
    <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation">
        <a class="app-brand" th:href="@{/Home}">
            <span class="brand-symbol" aria-hidden="true">OC</span>
            <span><strong>OFFICE CENTRAL</strong><small>ERP WORKSPACE</small></span>
        </a>

        <div class="nav-section-label">Inventory Platform</div>

        <!-- Grouped Navigation Modules -->
        <div class="nav-modules" th:if="${navigationModules != null and !#maps.isEmpty(navigationModules)}">
            <details class="nav-module" 
                     th:each="moduleEntry : ${navigationModules}" 
                     th:open="${moduleEntry.key == currentNavigationModule}">
                <summary class="nav-module-toggle">
                    <span class="nav-module-icon" 
                          aria-hidden="true" 
                          th:text="${navigationModuleIcons != null and navigationModuleIcons.containsKey(moduleEntry.key) ? navigationModuleIcons[moduleEntry.key] : '📁'}">📁</span>
                    <span class="nav-module-name" th:text="${moduleEntry.key}">Module Name</span>
                    <span class="nav-module-chevron" aria-hidden="true">▾</span>
                </summary>
                <div class="nav-module-links">
                    <a class="app-nav-link"
                       th:each="navPage : ${moduleEntry.value}"
                       th:href="@{${navPage.url}}"
                       th:classappend="${currentRequestPath == navPage.url or (currentRequestPath != null and #strings.startsWith(currentRequestPath, navPage.url + '/'))} ? ' active' : ''"
                       th:attr="aria-current=${currentRequestPath == navPage.url or (currentRequestPath != null and #strings.startsWith(currentRequestPath, navPage.url + '/'))} ? 'page' : null">
                        <span class="nav-icon" aria-hidden="true">▤</span>
                        <span th:text="${navPage.name}">Application Page</span>
                    </a>
                </div>
            </details>
        </div>

        <p class="app-nav-empty" th:if="${navigationModules == null or #maps.isEmpty(navigationModules)}">No pages assigned.</p>

        <div class="sidebar-footer">
            <span class="sidebar-footer-label">Current Store</span>
            <strong th:text="${selectedCompany != null ? selectedCompany : 'SRS'}">SRS</strong>
            <a th:href="@{/select-company}" class="change-company">Change Store</a>
        </div>
    </aside>

    <!-- Header Topbar -->
    <header class="app-topbar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>

        <div class="topbar-company">
            <span class="company-indicator"></span>
            <span class="company-caption">COMPANY</span>
            <strong th:text="${selectedCompany != null ? selectedCompany : 'SRS'}">SRS</strong>
        </div>

        <div class="topbar-session">
            <div class="user-avatar" 
                 aria-hidden="true" 
                 th:text="${loggedInUser != null and !#strings.isEmpty(loggedInUser) ? #strings.substring(loggedInUser, 0, 1).toUpperCase() : 'U'}">U</div>
            <div class="user-details">
                <strong th:text="${loggedInUser != null ? loggedInUser : 'User'}">user</strong>
                <span>
                    <span th:text="${userRole != null ? userRole : 'Role'}">Role</span>
                    <span th:if="${userDepartment != null and !#strings.isEmpty(userDepartment)}" th:text="| · ${userDepartment}|"> · Department</span>
                </span>
            </div>
            <form th:action="@{/logout}" method="post" class="topbar-logout">
                <button type="submit" aria-label="Sign out" title="Sign out">↪</button>
            </form>
        </div>
    </header>
    <script th:src="@{/js/app-shell.js}" defer></script>
</div>
