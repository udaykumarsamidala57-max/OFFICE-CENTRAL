<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Store | Office Central ERP</title>
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card company-card">
  
   
    <h1>Select a Store</h1>
    <p class="intro">Signed in as <strong th:text="${username}">user</strong>. Choose the Store database for this session.</p>

    <div class="notice notice-error" role="alert" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/select-company}" method="post">
        <fieldset class="company-options" th:if="${!#lists.isEmpty(companies)}">
            <legend class="visually-hidden">Available Stores</legend>
            <label class="company-option" th:each="company, iter : ${companies}">
                <input type="radio" name="company" th:value="${company}" required
                       th:checked="${company == selectedCompany or (selectedCompany == null and iter.index == 0)}">
                <span class="company-name" th:text="${company}">SRS</span>
               
            </label>
        </fieldset>
        <p class="intro" th:if="${#lists.isEmpty(companies)}">No company databases are assigned to your account.</p>
        <button type="submit" class="primary-action" th:disabled="${#lists.isEmpty(companies)}">Connect and continue</button>
    </form>

    <form th:action="@{/logout}" method="post" class="secondary-form">
        <button type="submit" class="text-action">Sign out</button>
    </form>
</main>
</body>
</html>
