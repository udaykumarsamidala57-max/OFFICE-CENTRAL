<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Indent - Salesforce SLDS</title>
    
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <link rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link rel="stylesheet" th:href="@{/css/INDENT/indent.css}">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="app-body">
<div th:replace="~{fragments/app-header :: appHeader('create')}"></div>

<div class="app-main-content">
    <div class="slds-page-container">

        <!-- ===================== PAGE HEADER ===================== -->
        <header class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-orders">
                                <svg class="slds-icon" aria-hidden="true" viewBox="0 0 52 52">
                                    <path d="M42 10H10c-1.1 0-2 .9-2 2v28c0 1.1.9 2 2 2h32c1.1 0 2-.9 2-2V12c0-1.1-.9-2-2-2zm-2 26H12V14h28v22z"/>
                                    <path d="M16 18h20v4H16zm0 7h20v4H16zm0 7h12v4H16z"/>
                                </svg>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-breadcrumb">Inventory &bull; Indents</p>
                            <h1 class="slds-page-header__title">Create New Indent</h1>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===================== MAIN CARD ===================== -->
        <div class="slds-card">
            <form th:action="@{/IndentServlet}" method="post" id="indentForm">

                <!-- SECTION 1: HEADER DETAILS -->
                <div class="slds-card__body">
                    <h2 class="slds-section-title">
                        <svg class="slds-section-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg>
                        Indent Details
                    </h2>
                    
                    <div class="slds-grid">
                        <div class="slds-form-element">
                            <label class="slds-label" for="indentNo">Indent No</label>
                            <div class="slds-input-group">
                                <input type="text"
                                       id="indentNo"
                                       class="slds-input slds-input--readonly"
                                       th:value="${nextIndentNo}"
                                       readonly>
                            </div>
                        </div>

                        <div class="slds-form-element">
                            <label class="slds-label slds-required" for="date">Date</label>
                            <div class="slds-input-group">
                                <input type="date"
                                       id="date"
                                       name="date"
                                       class="slds-input"
                                       required>
                            </div>
                        </div>

                        <div class="slds-form-element">
                            <label class="slds-label slds-required" for="indentType">Indent Type</label>
                            <div class="slds-select-wrapper">
                                <select id="indentType"
                                        name="indentType"
                                        class="slds-select"
                                        required>
                                    <option value="">Select Type</option>
                                    <option value="Purchase">Purchase</option>
                                    <option value="Issue">Issue</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 2: CATEGORY SELECTION -->
                    <h2 class="slds-section-title" style="margin-top: 1.5rem;">
                        <svg class="slds-section-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
                        Classification Selection
                    </h2>

                    <div class="slds-grid">
                        <div class="slds-form-element">
                            <label class="slds-label slds-required" for="department">Department</label>
                            <div class="slds-select-wrapper">
                                <select id="department"
                                        name="department"
                                        class="slds-select"
                                        required
                                        onchange="loadCategories()">
                                    <option value="">Select Department</option>
                                    <option th:each="d : ${masterData.departments}"
                                            th:value="${d.departmentName}"
                                            th:text="${d.departmentName}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="slds-form-element">
                            <label class="slds-label slds-required" for="category">Category</label>
                            <div class="slds-select-wrapper">
                                <select id="category"
                                        class="slds-select"
                                        required
                                        onchange="loadSubCategories()">
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="slds-form-element">
                            <label class="slds-label slds-required" for="subcategory">Sub-Category</label>
                            <div class="slds-select-wrapper">
                                <select id="subcategory"
                                        class="slds-select"
                                        required
                                        onchange="loadItemsForSelection()">
                                    <option value="">Select Sub-Category</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SELECTION BADGE -->
                    <div id="selectionInfo" class="slds-scoped-notification" style="display:none;">
                        <svg class="slds-scoped-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        <span>
                            <strong>Active Context:</strong>
                            <span id="selectedDepartment" class="slds-badge"></span> &rsaquo;
                            <span id="selectedCategory" class="slds-badge"></span> &rsaquo;
                            <span id="selectedSubCategory" class="slds-badge"></span>
                        </span>
                    </div>

                    <!-- SECTION 3: LINE ITEMS -->
                    <div class="slds-section-header">
                        <h2 class="slds-section-title" style="margin: 0;">
                            <svg class="slds-section-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                            Line Items
                        </h2>
                        <button type="button"
                                class="slds-button slds-button--neutral"
                                th:if="${isSuperAdmin or allowedButtonCodes.contains('ADD_ITEM')}"
                                onclick="addItem()">
                            <svg class="slds-btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            Add Line Item
                        </button>
                    </div>

                    <div class="slds-table-container">
                        <table class="slds-table">
                            <thead>
                                <tr>
                                    <th style="width: 35%;">Item Name</th>
                                    <th style="width: 15%;">Quantity</th>
                                    <th style="width: 12%;">UOM</th>
                                    <th style="width: 12%;">Stock</th>
                                    <th style="width: 20%;">Purpose</th>
                                    <th style="width: 6%; text-align: center;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="itemTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- ===================== HIDDEN VALUES ===================== -->
                <input type="hidden" name="itemIds" id="itemIds">
                <input type="hidden" name="itemNames" id="itemNames">
                <input type="hidden" name="quantities" id="quantities">
                <input type="hidden" name="purposes" id="purposes">
                <input type="hidden" name="uoms" id="uoms">

                <!-- FOOTER ACTIONS -->
                <div class="slds-card__footer">
                    <button type="submit" class="slds-button slds-button--brand" th:if="${isSuperAdmin or allowedButtonCodes.contains('SAVE_INDENT')}">
                        <svg class="slds-btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                        Save Indent
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">

const INDENT_BASE_URL = /*[[@{/IndentServlet}]]*/ "/IndentServlet";
const CAN_REMOVE_ITEM = /*[[${isSuperAdmin or allowedButtonCodes.contains('REMOVE_ITEM')}]]*/ false;
let currentItems = [];

/* =============================================================
   PAGE LOAD
   ============================================================= */
$(document).ready(function () {
    const dateInput = document.getElementById("date");
    if (!dateInput.value) {
        const now = new Date();
        const localDate =
            now.getFullYear() + "-" +
            String(now.getMonth() + 1).padStart(2, "0") + "-" +
            String(now.getDate()).padStart(2, "0");

        dateInput.value = localDate;
    }
});

/* =============================================================
   LOAD CATEGORIES
   ============================================================= */
function loadCategories() {
    const department = $("#department").val();

    resetSelect("#category", "Select Category");
    resetSelect("#subcategory", "Select Sub-Category");

    currentItems = [];
    hideSelection();

    if (!department) return;

    $("#category").prop("disabled", true);
    $("#subcategory").prop("disabled", true);

    $.ajax({
        url: INDENT_BASE_URL + "/categories",
        type: "GET",
        data: { department: department },
        dataType: "json",
        success: function (data) {
            if (!Array.isArray(data) || data.length === 0) {
                alert("No categories found for the selected department.");
                return;
            }

            $.each(data, function (index, category) {
                if (category.category) {
                    $("#category").append(
                        $("<option>", {
                            value: category.category,
                            text: category.category
                        })
                    );
                }
            });
        },
        error: function (xhr) {
            console.error("Category loading error:", xhr.status, xhr.responseText);
            alert("Unable to load categories for the selected department.");
        },
        complete: function () {
            $("#category").prop("disabled", false);
        }
    });
}

/* =============================================================
   LOAD SUB-CATEGORIES
   ============================================================= */
function loadSubCategories() {
    const department = $("#department").val();
    const category = $("#category").val();

    resetSelect("#subcategory", "Select Sub-Category");

    currentItems = [];
    hideSelection();

    if (!department || !category) return;

    $("#subcategory").prop("disabled", true);

    $.ajax({
        url: INDENT_BASE_URL + "/subcategories",
        type: "GET",
        data: {
            department: department,
            category: category
        },
        dataType: "json",
        success: function (data) {
            if (!Array.isArray(data) || data.length === 0) {
                alert("No sub-categories found for the selected category.");
                return;
            }

            $.each(data, function (index, subCategory) {
                if (subCategory.subCategory) {
                    $("#subcategory").append(
                        $("<option>", {
                            value: subCategory.subCategory,
                            text: subCategory.subCategory
                        })
                    );
                }
            });
        },
        error: function (xhr) {
            console.error("Sub-category loading error:", xhr.status, xhr.responseText);
            alert("Unable to load sub-categories.");
        },
        complete: function () {
            $("#subcategory").prop("disabled", false);
        }
    });
}

/* =============================================================
   LOAD ITEMS
   ============================================================= */
function loadItemsForSelection() {
    const department = $("#department").val();
    const category = $("#category").val();
    const subCategory = $("#subcategory").val();

    currentItems = [];
    hideSelection();

    if (!department || !category || !subCategory) return;

    $.ajax({
        url: INDENT_BASE_URL + "/items",
        type: "GET",
        data: {
            category: category,
            subCategory: subCategory
        },
        dataType: "json",
        success: function (data) {
            currentItems = Array.isArray(data) ? data : [];

            $("#selectedDepartment").text(department);
            $("#selectedCategory").text(category);
            $("#selectedSubCategory").text(subCategory);

            $("#selectionInfo").css("display", "flex");

            if (currentItems.length === 0) {
                alert("No items found for the selected Category and Sub-Category.");
            }
        },
        error: function (xhr) {
            currentItems = [];
            console.error("Item loading error:", xhr.status, xhr.responseText);
            alert("Unable to load items.");
        }
    });
}

/* =============================================================
   ADD ITEM ROW
   ============================================================= */
function addItem() {
    const department = $("#department").val();
    const category = $("#category").val();
    const subCategory = $("#subcategory").val();

    if (!department || !category || !subCategory) {
        alert("Please select Department, Category and Sub-Category first.");
        return;
    }

    if (!currentItems || currentItems.length === 0) {
        alert("No items found for the selected Category and Sub-Category.");
        return;
    }

    const rowId = "row_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

    const row = $(
        `<tr id="${rowId}">
            <td data-label="Item">
                <div class="slds-select-wrapper">
                    <select class="item slds-select" required onchange="setItem(this)">
                        ${getItemOptionsHtml(currentItems)}
                    </select>
                </div>
            </td>

            <td data-label="Quantity">
                <input type="number"
                       class="qty slds-input"
                       min="0.01"
                       step="0.01"
                       required>
            </td>

            <td data-label="UOM" class="uom"><span class="slds-pill-val">-</span></td>
            <td data-label="Stock" class="stock"><span class="slds-pill-val">-</span></td>

            <td data-label="Purpose">
                <input type="text" class="purpose slds-input" placeholder="e.g. Project usage">
            </td>

            <td data-label="Action" style="text-align: center;">
                ${CAN_REMOVE_ITEM ? `
                    <button type="button" class="slds-button-icon-danger" title="Remove Item" onclick="removeItem(this)">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                ` : ''}
            </td>
        </tr>`
    );

    row.data("items", currentItems.slice());

    $("#itemTable").append(row);
    row.find(".item").focus();
}

/* =============================================================
   CREATE ITEM OPTIONS
   ============================================================= */
function getItemOptionsHtml(items) {
    let html = '<option value="">Select Item</option>';

    $.each(items, function (index, item) {
        html +=
            '<option value="' + index + '">' +
            escapeHtml(item.itemName || "") +
            '</option>';
    });

    return html;
}

/* =============================================================
   SET SELECTED ITEM DETAILS
   ============================================================= */
function setItem(selectElement) {
    const row = $(selectElement).closest("tr");
    const index = $(selectElement).val();
    const items = row.data("items");

    if (index === "" || index === null || !items) {
        row.find(".uom").html('<span class="slds-pill-val">-</span>');
        row.find(".stock").html('<span class="slds-pill-val">-</span>');
        return;
    }

    const item = items[Number(index)];

    if (!item) {
        row.find(".uom").html('<span class="slds-pill-val">-</span>');
        row.find(".stock").html('<span class="slds-pill-val">-</span>');
        return;
    }

    row.find(".uom").html('<span class="slds-pill-val">' + escapeHtml(item.uom || "-") + '</span>');
    row.find(".stock").html('<span class="slds-pill-val">' + (item.stock != null ? item.stock : 0) + '</span>');
}

/* =============================================================
   REMOVE ROW
   ============================================================= */
function removeItem(buttonElement) {
    $(buttonElement).closest("tr").remove();
}

/* =============================================================
   FORM SUBMIT
   ============================================================= */
$("#indentForm").on("submit", function (e) {
    const rows = $("#itemTable tr");

    if (rows.length === 0) {
        alert("Please add at least one item.");
        e.preventDefault();
        return;
    }

    const ids = [];
    const names = [];
    const quantities = [];
    const purposes = [];
    const uoms = [];

    let validCount = 0;

    rows.each(function () {
        const row = $(this);
        const select = row.find(".item");
        const index = select.val();
        const items = row.data("items");

        if (index === "" || index === null || !items) return;

        const item = items[Number(index)];
        if (!item) return;

        const quantity = row.find(".qty").val();
        if (!quantity || parseFloat(quantity) <= 0) return;

        ids.push(item.itemId);
        names.push(cleanValue(item.itemName));
        quantities.push(quantity);
        purposes.push(cleanValue(row.find(".purpose").val()));
        uoms.push(cleanValue(item.uom));

        validCount++;
    });

    if (validCount === 0) {
        alert("Please select valid items and enter quantities.");
        e.preventDefault();
        return;
    }

    if (ids.length !== validCount ||
        names.length !== validCount ||
        quantities.length !== validCount ||
        purposes.length !== validCount ||
        uoms.length !== validCount) {

        alert("Please check all item rows.");
        e.preventDefault();
        return;
    }

    $("#itemIds").val(ids.join(","));
    $("#itemNames").val(names.join(","));
    $("#quantities").val(quantities.join(","));
    $("#purposes").val(purposes.join(","));
    $("#uoms").val(uoms.join(","));
});

/* =============================================================
   HELPERS
   ============================================================= */
function resetSelect(selector, placeholder) {
    $(selector)
        .empty()
        .append(
            $("<option>", {
                value: "",
                text: placeholder
            })
        );
}

function hideSelection() {
    $("#selectionInfo").hide();
}

function cleanValue(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/,/g, " ").trim();
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
