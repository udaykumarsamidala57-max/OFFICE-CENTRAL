<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Indent</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <th:block th:replace="~{fragments/indent-styles :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/indent.css(v=20261008-indent)}">
</head>

<body class="app-body indent-create-page">
<div th:replace="~{fragments/app-header :: appHeader('create')}"></div>

<div class="app-main-content">
    <div class="indent-ui-page-container">

        <!-- PAGE HEADER -->
        <header class="indent-ui-page-header page-subheader">
            <div class="indent-ui-page-header__row">
                <div class="indent-ui-page-header__col-title">
                    <div class="indent-ui-media">
                        <div class="indent-ui-media__body">
                            <p class="indent-ui-breadcrumb">Inventory &bull; Indents</p>
                            <h1 class="indent-ui-page-header__title">Create New Indent</h1>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN CARD -->
        <div class="indent-ui-card">
            <form th:action="@{/IndentServlet}" method="post" id="indentForm">

                <div class="indent-ui-card__body">
                    <!-- SECTION 1: HEADER DETAILS -->
                    <h2 class="indent-ui-section-title">
                        <svg class="indent-ui-section-icon" viewBox="0 0 24 24"><path d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg>
                        Indent Details
                    </h2>
                    
                    <div class="indent-ui-grid">
                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label" for="indentNo">Indent No</label>
                            <div class="indent-ui-input-group">
                                <input type="text"
                                       id="indentNo"
                                       class="indent-ui-input indent-ui-input--readonly"
                                       th:value="${nextIndentNo}"
                                       readonly>
                            </div>
                        </div>

                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label indent-ui-required" for="date">Date</label>
                            <div class="indent-ui-input-group">
                                <input type="date"
                                       id="date"
                                       name="date"
                                       class="indent-ui-input"
                                       required>
                            </div>
                        </div>

                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label indent-ui-required" for="indentType">Indent Type</label>
                            <div class="indent-ui-select-wrapper">
                                <select id="indentType"
                                        name="indentType"
                                        class="indent-ui-select"
                                        required>
                                    <option value="">Select Type</option>
                                    <option value="Purchase">Purchase</option>
                                    <option value="Issue">Issue</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 2: CATEGORY SELECTION -->
                    <h2 class="indent-ui-section-title">
                        <svg class="indent-ui-section-icon" viewBox="0 0 24 24"><path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z"/></svg>
                        Classification Selection
                    </h2>

                    <div class="indent-ui-grid">
                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label indent-ui-required" for="department">Department</label>
                            <div class="indent-ui-select-wrapper">
                                <select id="department"
                                        name="department"
                                        class="indent-ui-select"
                                        required
                                        onchange="loadCategories()">
                                    <option value="">Select Department</option>
                                    <option th:each="d : ${masterData.departments}"
                                            th:value="${d.departmentName}"
                                            th:text="${d.departmentName}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label indent-ui-required" for="category">Category</label>
                            <div class="indent-ui-select-wrapper">
                                <select id="category"
                                        class="indent-ui-select"
                                        required
                                        onchange="loadSubCategories()">
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="indent-ui-form-element">
                            <label class="indent-ui-label indent-ui-required" for="subcategory">Sub-Category</label>
                            <div class="indent-ui-select-wrapper">
                                <select id="subcategory"
                                        class="indent-ui-select"
                                        required
                                        onchange="loadItemsForSelection()">
                                    <option value="">Select Sub-Category</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SELECTION BADGE -->
                    <div id="selectionInfo" class="indent-ui-scoped-notification" hidden>
                        <div>
                            <strong>Active Context:</strong><br/>
                            <span id="selectedDepartment" class="indent-ui-badge"></span> &rsaquo;
                            <span id="selectedCategory" class="indent-ui-badge"></span> &rsaquo;
                            <span id="selectedSubCategory" class="indent-ui-badge"></span>
                        </div>
                    </div>

                    <!-- SECTION 3: LINE ITEMS -->
                    <div class="indent-ui-section-header">
                        <h2 class="indent-ui-section-title">
                            <svg class="indent-ui-section-icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                            Line Items
                        </h2>
                    </div>

                    <div class="indent-ui-table-container">
                        <table class="indent-ui-table responsive-item-table">
                            <thead>
                                <tr>
                                    <th style="width:30%;">Item Name</th>
                                    <th style="width:15%;">Quantity</th>
                                    <th style="width:12%;">UOM</th>
                                    <th style="width:12%;">Stock</th>
                                    <th style="width:23%;">Purpose</th>
                                    <th style="width:8%; text-align:center;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="itemTable"></tbody>
                        </table>
                    </div>

                    <!-- ADD ITEM ACTION BUTTON -->
                    <div class="add-item-action-wrapper">
                        <button type="button"
                                class="indent-ui-button indent-ui-button--neutral"
                                th:if="${isSuperAdmin or allowedButtonCodes.contains('ADD_ITEM')}"
                                onclick="addItem()">
                            <svg class="indent-ui-btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            Add Line Item
                        </button>
                    </div>

                </div>

                <!-- HIDDEN DATA FIELDS -->
                <input type="hidden" name="itemIds" id="itemIds">
                <input type="hidden" name="itemNames" id="itemNames">
                <input type="hidden" name="quantities" id="quantities">
                <input type="hidden" name="purposes" id="purposes">
                <input type="hidden" name="uoms" id="uoms">

                <!-- FIXED / STICKY FOOTER ACTIONS -->
                <div class="indent-ui-card__footer">
                    <button type="submit" class="indent-ui-button indent-ui-button--brand" th:if="${isSuperAdmin or allowedButtonCodes.contains('SAVE_INDENT')}">
                        <svg class="indent-ui-btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                        Save Indent
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">

const INDENT_BASE_URL = /*[[@{/IndentServlet}]]*/ "/IndentServlet";
const CAN_REMOVE_ITEM = /*[[${isSuperAdmin or allowedButtonCodes.contains('REMOVE_ITEM')}]]*/ false;
let currentItems = [];

$(document).ready(function () {
    const dateInput = document.getElementById("date");
    if (!dateInput.value) {
        const now = new Date();
        const localDate =
            now.getFullYear() + "-" +
            String(now.getMonth() + 1).padStart(2, "0") + "-" +
            String(now.getDate()).padStart(2, "0");

        dateInput.value = localDate;
    }
});

function loadCategories() {
    const department = $("#department").val();

    resetSelect("#category", "Select Category");
    resetSelect("#subcategory", "Select Sub-Category");

    currentItems = [];
    hideSelection();

    if (!department) return;

    $("#category").prop("disabled", true);
    $("#subcategory").prop("disabled", true);

    $.ajax({
        url: INDENT_BASE_URL + "/categories",
        type: "GET",
        data: { department: department },
        dataType: "json",
        success: function (data) {
            if (!Array.isArray(data) || data.length === 0) {
                alert("No categories found for the selected department.");
                return;
            }

            $.each(data, function (index, category) {
                if (category.category) {
                    $("#category").append(
                        $("<option>", {
                            value: category.category,
                            text: category.category
                        })
                    );
                }
            });
        },
        error: function (xhr) {
            console.error("Category loading error:", xhr.status, xhr.responseText);
            alert("Unable to load categories for the selected department.");
        },
        complete: function () {
            $("#category").prop("disabled", false);
        }
    });
}

function loadSubCategories() {
    const department = $("#department").val();
    const category = $("#category").val();

    resetSelect("#subcategory", "Select Sub-Category");

    currentItems = [];
    hideSelection();

    if (!department || !category) return;

    $("#subcategory").prop("disabled", true);

    $.ajax({
        url: INDENT_BASE_URL + "/subcategories",
        type: "GET",
        data: {
            department: department,
            category: category
        },
        dataType: "json",
        success: function (data) {
            if (!Array.isArray(data) || data.length === 0) {
                alert("No sub-categories found for the selected category.");
                return;
            }

            $.each(data, function (index, subCategory) {
                if (subCategory.subCategory) {
                    $("#subcategory").append(
                        $("<option>", {
                            value: subCategory.subCategory,
                            text: subCategory.subCategory
                        })
                    );
                }
            });
        },
        error: function (xhr) {
            console.error("Sub-category loading error:", xhr.status, xhr.responseText);
            alert("Unable to load sub-categories.");
        },
        complete: function () {
            $("#subcategory").prop("disabled", false);
        }
    });
}

function loadItemsForSelection() {
    const department = $("#department").val();
    const category = $("#category").val();
    const subCategory = $("#subcategory").val();

    currentItems = [];
    hideSelection();

    if (!department || !category || !subCategory) return;

    $.ajax({
        url: INDENT_BASE_URL + "/items",
        type: "GET",
        data: {
            category: category,
            subCategory: subCategory
        },
        dataType: "json",
        success: function (data) {
            currentItems = Array.isArray(data) ? data : [];

            $("#selectedDepartment").text(department);
            $("#selectedCategory").text(category);
            $("#selectedSubCategory").text(subCategory);

            document.getElementById("selectionInfo").hidden = false;

            if (currentItems.length === 0) {
                alert("No items found for the selected Category and Sub-Category.");
            }
        },
        error: function (xhr) {
            currentItems = [];
            console.error("Item loading error:", xhr.status, xhr.responseText);
            alert("Unable to load items.");
        }
    });
}

function addItem() {
    const department = $("#department").val();
    const category = $("#category").val();
    const subCategory = $("#subcategory").val();

    if (!department || !category || !subCategory) {
        alert("Please select Department, Category and Sub-Category first.");
        return;
    }

    if (!currentItems || currentItems.length === 0) {
        alert("No items found for the selected Category and Sub-Category.");
        return;
    }

    const rowId = "row_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

    const row = $(
        `<tr id="${rowId}" class="indent-item-row">
            <td data-label="Item Name">
                <div class="indent-ui-select-wrapper">
                    <select class="item indent-ui-select" required onchange="setItem(this)">
                        ${getItemOptionsHtml(currentItems)}
                    </select>
                </div>
            </td>

            <td data-label="Quantity">
                <input type="number"
                       class="qty indent-ui-input"
                       min="0.01"
                       step="0.01"
                       placeholder="0.00"
                       inputmode="decimal"
                       required>
            </td>

            <td data-label="UOM" class="uom"><span class="indent-ui-pill-val">-</span></td>
            <td data-label="Stock" class="stock"><span class="indent-ui-pill-val">-</span></td>

            <td data-label="Purpose">
                <input type="text" class="purpose indent-ui-input" placeholder="e.g. Project usage">
            </td>

            <td data-label="Action">
                ${CAN_REMOVE_ITEM ? `
                    <button type="button" class="indent-ui-button-icon-danger" title="Remove Item" onclick="removeItem(this)">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        <span>Remove Item</span>
                    </button>
                ` : ''}
            </td>
        </tr>`
    );

    row.data("items", currentItems.slice());
    $("#itemTable").append(row);
    row.find(".item").focus();
}

function getItemOptionsHtml(items) {
    let html = '<option value="">Select Item</option>';
    $.each(items, function (index, item) {
        html += '<option value="' + index + '">' + escapeHtml(item.itemName || "") + '</option>';
    });
    return html;
}

function setItem(selectElement) {
    const row = $(selectElement).closest("tr");
    const index = $(selectElement).val();
    const items = row.data("items");

    if (index === "" || index === null || !items) {
        row.find(".uom").html('<span class="indent-ui-pill-val">-</span>');
        row.find(".stock").html('<span class="indent-ui-pill-val">-</span>');
        return;
    }

    const item = items[Number(index)];

    if (!item) {
        row.find(".uom").html('<span class="indent-ui-pill-val">-</span>');
        row.find(".stock").html('<span class="indent-ui-pill-val">-</span>');
        return;
    }

    row.find(".uom").html('<span class="indent-ui-pill-val">' + escapeHtml(item.uom || "-") + '</span>');
    row.find(".stock").html('<span class="indent-ui-pill-val">' + (item.stock != null ? item.stock : 0) + '</span>');
}

function removeItem(buttonElement) {
    $(buttonElement).closest("tr").remove();
}

$("#indentForm").on("submit", function (e) {
    const rows = $("#itemTable tr");

    if (rows.length === 0) {
        alert("Please add at least one item.");
        e.preventDefault();
        return;
    }

    const ids = [];
    const names = [];
    const quantities = [];
    const purposes = [];
    const uoms = [];

    let validCount = 0;

    rows.each(function () {
        const row = $(this);
        const select = row.find(".item");
        const index = select.val();
        const items = row.data("items");

        if (index === "" || index === null || !items) return;

        const item = items[Number(index)];
        if (!item) return;

        const quantity = row.find(".qty").val();
        if (!quantity || parseFloat(quantity) <= 0) return;

        ids.push(item.itemId);
        names.push(cleanValue(item.itemName));
        quantities.push(quantity);
        purposes.push(cleanValue(row.find(".purpose").val()));
        uoms.push(cleanValue(item.uom));

        validCount++;
    });

    if (validCount === 0) {
        alert("Please select valid items and enter quantities.");
        e.preventDefault();
        return;
    }

    $("#itemIds").val(ids.join(","));
    $("#itemNames").val(names.join(","));
    $("#quantities").val(quantities.join(","));
    $("#purposes").val(purposes.join(","));
    $("#uoms").val(uoms.join(","));
});

function resetSelect(selector, placeholder) {
    $(selector)
        .empty()
        .append(
            $("<option>", {
                value: "",
                text: placeholder
            })
        );
}

function hideSelection() {
    const selectionInfo = document.getElementById("selectionInfo");
    if (selectionInfo) selectionInfo.hidden = true;
}

function cleanValue(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/,/g, " ").trim();
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
