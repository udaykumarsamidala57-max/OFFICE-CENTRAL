<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue Stock</title>
  <link rel="stylesheet" th:href="@{/css/app-theme.css}"><link rel="stylesheet" th:href="@{/css/app-shell.css}"><link rel="stylesheet" th:href="@{/css/stock/issue-stock.css(v=20261006)}">
</head>
<body class="app-body inventory-page">
<div th:replace="~{fragments/app-header :: appHeader('issue-entry')}"></div>
<main class="app-main-content inventory-content"><div class="inventory-shell">
  <div class="inventory-heading"><div><span class="inventory-eyebrow">INVENTORY CONTROL</span><h1>Issue Stock</h1></div><a class="inv-button secondary" th:href="@{/issues/report}">Issue Report</a></div>
  <div class="inv-alert success" th:if="${success}" th:text="${success}" role="status"></div><div class="inv-alert error" th:if="${error}" th:text="${error}" role="alert"></div>
  <section class="inv-card">
    <div class="inv-section-heading"><div><span class="inventory-eyebrow">APPROVED REQUESTS</span><h2>Indents Pending Issue</h2></div><span class="inv-count" th:text="|${#lists.size(pendingIssues)} pending|">0 pending</span></div>
    <div class="inv-table-scroll"><table class="inv-table" id="pendingIssueTable">
      <thead><tr><th>Indent</th><th>Requested By</th><th>Department</th><th>Item</th><th>Requested</th><th>Available</th><th>UOM</th><th>Unit Price (₹)</th><th>Purpose</th><th>Issue Qty</th><th>Issue Date</th><th>Action</th></tr></thead>
      <tbody>
        <tr th:each="row : ${pendingIssues}">
          <td data-label="Indent" class="inv-key" th:text="${row.indentNo}">1001</td><td data-label="Requested By" th:text="${row.requestedBy}">User</td>
          <td data-label="Department" th:text="${row.department}">Department</td><td data-label="Item" class="inv-item" th:text="${row.itemName}">Item</td>
          <td data-label="Requested" class="inv-number" th:text="${#numbers.formatDecimal(row.qty,1,2)}">0.00</td>
          <td data-label="Available" class="inv-number" th:classappend="${row.availableStock < row.qty} ? ' inv-low-stock' : ' inv-stock-ok'" th:text="${#numbers.formatDecimal(row.availableStock,1,2)}">0.00</td>
          <td data-label="UOM" th:text="${row.uom ?: '-'}">-</td>
          <td data-label="Unit Price"><input class="inv-input inv-price" type="number" min="0" step="0.01" th:value="${row.unitPrice}" th:attr="form=|issue-${row.indentId}|" name="unitPrice" required></td>
          <td data-label="Purpose" class="inv-purpose"><span class="inv-purpose-wrap" th:text="${row.purpose ?: '-'}">Purpose</span></td>
          <td data-label="Issue Qty"><input class="inv-input" type="number" min="0.01" step="0.01" th:max="${row.qty}" th:attr="form=|issue-${row.indentId}|" name="qtyIssued" required></td>
          <td data-label="Issue Date"><input class="inv-input" type="date" th:value="${today}" th:attr="form=|issue-${row.indentId}|" name="issueDate" required></td>
          <td data-label="Action"><form th:id="|issue-${row.indentId}|" method="post" th:action="@{/issues/entry}" onsubmit="return confirm('Post this stock issue?')"><input type="hidden" name="indentId" th:value="${row.indentId}"><button type="submit" class="inv-button primary" th:if="${isSuperAdmin or allowedButtonCodes.contains('PROCESS_ISSUE')}" th:disabled="${row.availableStock <= 0}">Issue</button></form></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pendingIssues)}"><td colspan="12" class="inv-empty">No approved indents are waiting for stock issue.</td></tr>
      </tbody>
    </table></div>
  </section>
</div></main>
</body></html>
